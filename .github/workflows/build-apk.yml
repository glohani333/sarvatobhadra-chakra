name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Flutter project structure (if missing)
        run: |
          if [ ! -d "android" ]; then
            echo "android folder missing, generating..."
            flutter create . --project-name sarvatobhadra_chakra --org com.sarvatobhadra
          fi

      - name: Force high compileSdk (35)
        run: |
          echo "Updating compileSdk..."

          # Method 1: build.gradle
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion [0-9]\+/compileSdkVersion 35/' android/app/build.gradle
            sed -i 's/compileSdk = [0-9]\+/compileSdk = 35/' android/app/build.gradle
            sed -i 's/compileSdk [0-9]\+/compileSdk 35/' android/app/build.gradle
          fi

          # Method 2: build.gradle.kts
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = [0-9]\+/compileSdk = 35/' android/app/build.gradle.kts
            sed -i 's/compileSdkVersion = [0-9]\+/compileSdkVersion = 35/' android/app/build.gradle.kts
          fi

          # Method 3: Force using gradle.properties
          echo "android.defaults.buildfeatures.buildconfig=true" >> android/gradle.properties
          echo "android.nonTransitiveRClass=false" >> android/gradle.properties
          echo "android.nonFinalResIds=false" >> android/gradle.properties

          # Show current setting
          echo "----- Current compileSdk settings -----"
          grep -r "compileSdk" android/app/ || true
          echo "---------------------------------------"

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sarvatobhadra-apk
          path: build/app/outputs/flutter-apk/app-release.apk
