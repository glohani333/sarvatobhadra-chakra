name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Flutter project structure (if missing)
        run: |
          if [ ! -d "android" ]; then
            echo "android folder missing, generating..."
            flutter create . --project-name sarvatobhadra_chakra --org com.sarvatobhadra
          fi

      - name: Update compileSdk to 35
        run: |
          # For build.gradle
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdk = .*/compileSdk = 35/' android/app/build.gradle || true
            sed -i 's/compileSdkVersion .*/compileSdkVersion 35/' android/app/build.gradle || true
          fi

          # For build.gradle.kts (newer Flutter)
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = .*/compileSdk = 35/' android/app/build.gradle.kts || true
          fi

          echo "compileSdk updated to 35"

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sarvatobhadra-apk
          path: build/app/outputs/flutter-apk/app-release.apk
